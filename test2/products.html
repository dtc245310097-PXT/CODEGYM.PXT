<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách sản phẩm linh hoạt</title>
  <!-- Liên kết tệp CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Danh Sách Sản Phẩm</h1>

  <!-- Khối chứa danh sách sản phẩm (Flex Container) -->
  <div class="products">
    
    <!-- Sản phẩm 1 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60" alt="Sản phẩm 1">
      <h3>Đồng Hồ Thông Minh</h3>
      <p class="price">1.500.000 đ</p>
      <a href="#" class="btn">Mua ngay</a>
    </div>

    <!-- Sản phẩm 2 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="Sản phẩm 2">
      <h3>Tai Nghe Bluetooth</h3>
      <p class="price">850.000 đ</p>
      <a href="#" class="btn">Mua ngay</a>
    </div>

    <!-- Sản phẩm 3 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" alt="Sản phẩm 3">
      <h3>Giày Thể Thao Nam</h3>
      <p class="price">1.200.000 đ</p>
      <a href="#" class="btn">Mua ngay</a>
    </div>

    <!-- Sản phẩm 4 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500&auto=format&fit=crop&q=60" alt="Sản phẩm 4">
      <h3>Tay Cầm Chơi Game</h3>
      <p class="price">650.000 đ</p>
      <a href="#" class="btn">Mua ngay</a>
    </div>

    <!-- Sản phẩm 5 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500&auto=format&fit=crop&q=60" alt="Sản phẩm 5">
      <h3>Đồng Hồ Thể Thao</h3>
      <p class="price">2.100.000 đ</p>
      <a href="#" class="btn">Mua ngay</a>
    </div>

    <!-- Sản phẩm 6 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&auto=format&fit=crop&q=60" alt="Sản phẩm 6">
      <h3>Kính Mát Thời Trang</h3>
      <p class="price">450.000 đ</p>
      <a href="#" class="btn">Mua ngay</a>
    </div>

  </div>

</body>
</html>
